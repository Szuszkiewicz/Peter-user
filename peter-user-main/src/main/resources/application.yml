contract:
  title: "用户服务协议"
  version: "v1.0"
  update-time: "2026-05-31"
  content: |
  
    第一条 总则
    1.1 本协议是您与本平台之间关于使用本服务所订立的协议。
    1.2 用户在使用本平台服务之前，应当仔细阅读本协议的全部内容。
    1.3 用户一旦注册或使用本服务，即视为完全理解并接受本协议的全部条款。
    
    第二条 服务内容
    2.1 本平台为用户提供文章发布、评论互动、收藏点赞等服务。
    2.2 用户有权根据自己的需求选择使用本平台提供的各项服务。
    
    第三条 用户行为规范
    3.1 用户应当遵守国家法律法规，不得利用本服务从事违法违规行为。
    3.2 本平台保证用户的言论自由，不对用户的评论和文章进行任何形式的审查，但是用户不得发布含有暴力、色情等违法信息。
    3.3 用户应当尊重他人，不得发布侮辱、诽谤他人的言论。
    3.4 用户应当保护自己的账号安全，不得将账号转让、借用给他人使用。
    
    第四条 知识产权
    4.1 用户在平台发布的原创内容，知识产权归用户所有。
    4.2 用户授予平台在全球范围内免费的、不可撤销的使用许可。

    
    第五条 隐私保护
    5.1 平台重视用户隐私保护，将按照相关法律法规收集和使用用户信息。
    5.2 未经用户同意，平台不会向第三方透露用户的个人信息。
    
    第六条 违约责任
    6.1 用户违反本协议规定的，平台有权采取警告、限制功能、封号等措施。
    6.2 因用户违规行为给平台或第三方造成损失的，用户应当承担赔偿责任。
    
    第七条 协议的变更
    7.1 平台有权根据业务发展需要修改本协议条款。
    7.2 协议变更后，平台将通过公告等方式通知用户。
    7.3 用户继续使用服务即视为接受修改后的协议。
    
    第八条 其他
    8.1 本协议的解释权归平台所有。
    8.2 如本协议任何条款被认定为无效，不影响其他条款的效力。
    
    更新日期：2026年5月31日

